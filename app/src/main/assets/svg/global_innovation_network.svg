<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" width="640" height="240" fill="none">
  <defs>
    <linearGradient id="brandFlow" x1="40" y1="180" x2="600" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="cyanArc" x1="80" y1="60" x2="560" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.85"/>
    </linearGradient>
    <radialGradient id="coreSphere" cx="38%" cy="34%" r="65%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="55%" stop-color="#0E7490"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>
    <radialGradient id="purpleAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ambient Network Halos -->
  <circle cx="320" cy="120" r="108" fill="url(#purpleAura)"/>
  <circle cx="116" cy="126" r="68" fill="url(#cyanAura)"/>
  <circle cx="524" cy="114" r="68" fill="url(#cyanAura)"/>

  <!-- Subtle Telemetry Coordinate Grid -->
  <g stroke="#6366F1" stroke-opacity="0.14" stroke-width="1">
    <line x1="24" y1="44" x2="616" y2="44"/>
    <line x1="24" y1="120" x2="616" y2="120"/>
    <line x1="24" y1="196" x2="616" y2="196"/>
    <line x1="140" y1="16" x2="140" y2="224"/>
    <line x1="320" y1="16" x2="320" y2="224"/>
    <line x1="500" y1="16" x2="500" y2="224"/>
  </g>

  <!-- Outer Dashed Global Exchange Meridian -->
  <ellipse cx="320" cy="120" rx="252" ry="86" stroke="url(#brandFlow)" stroke-opacity="0.34" stroke-width="1.6" stroke-dasharray="6 6"/>

  <!-- Cross-Continental Innovation & Capital Corridors -->
  <path d="M68 164 C162 42, 478 34, 572 142" stroke="url(#brandFlow)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M74 78 C186 198, 454 202, 566 76" stroke="url(#cyanArc)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Interconnected Mesh Links -->
  <g stroke="#4F46E5" stroke-opacity="0.36" stroke-width="1.5">
    <line x1="116" y1="126" x2="222" y2="62"/>
    <line x1="222" y1="62" x2="320" y2="120"/>
    <line x1="320" y1="120" x2="418" y2="60"/>
    <line x1="418" y1="60" x2="524" y2="114"/>
    <line x1="116" y1="126" x2="228" y2="182"/>
    <line x1="228" y1="182" x2="320" y2="120"/>
    <line x1="320" y1="120" x2="414" y2="182"/>
    <line x1="414" y1="182" x2="524" y2="114"/>
  </g>

  <!-- Central Geodesic Wireframe Exchange & Glossy Sphere -->
  <polygon points="320,56 376,88 376,152 320,184 264,152 264,88" fill="#6366F1" fill-opacity="0.08" stroke="#1E1B4B" stroke-opacity="0.65" stroke-width="1.8"/>
  <g stroke="#1E1B4B" stroke-opacity="0.45" stroke-width="1.3">
    <line x1="320" y1="56" x2="320" y2="184"/>
    <line x1="264" y1="88" x2="376" y2="152"/>
    <line x1="376" y1="88" x2="264" y2="152"/>
  </g>
  <circle cx="320" cy="120" r="28" fill="url(#coreSphere)"/>
  <circle cx="310" cy="110" r="8" fill="#FFFFFF" fill-opacity="0.28"/>
  <ellipse cx="320" cy="120" rx="52" ry="18" transform="rotate(-22 320 120)" stroke="#22D3EE" stroke-width="2.4"/>

  <!-- Left Hub Pill: Creator / Idea Node -->
  <rect x="64" y="96" width="104" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.94" stroke="#8B5CF6" stroke-width="1.5"/>
  <circle cx="90" cy="126" r="13" fill="#7C3AED" fill-opacity="0.14"/>
  <circle cx="90" cy="123" r="6" fill="#7C3AED"/>
  <rect x="86" y="130" width="8" height="3" rx="1.5" fill="#475569"/>
  <text x="110" y="122" font-family="sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">IDEAS</text>
  <text x="110" y="136" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#6D28D9">AI Match</text>

  <!-- Right Hub Pill: Shielded Capital & IP Vault -->
  <rect x="472" y="84" width="106" height="60" rx="14" fill="#FFFFFF" fill-opacity="0.94" stroke="#0EA5E9" stroke-width="1.5"/>
  <circle cx="498" cy="114" r="13" fill="#10B981" fill-opacity="0.14"/>
  <path d="M498 104 L506 107.5 V113.5 C506 118.5 502.5 122.5 498 124 C493.5 122.5 490 118.5 490 113.5 V107.5 Z" fill="#10B981" fill-opacity="0.24" stroke="#10B981" stroke-width="1.6"/>
  <path d="M494.5 114 L497 116.5 L502 111.5" stroke="#059669" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="518" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#1E1B4B">CAPITAL</text>
  <text x="518" y="124" font-family="sans-serif" font-size="9.5" font-weight="600" fill="#059669">NDA Vault</text>

  <!-- Constellation Telemetry Nodes -->
  <circle cx="222" cy="62" r="11" fill="#7C3AED" fill-opacity="0.18"/>
  <circle cx="222" cy="62" r="5.5" fill="#7C3AED"/>
  <circle cx="418" cy="60" r="11" fill="#06B6D4" fill-opacity="0.18"/>
  <circle cx="418" cy="60" r="5.5" fill="#06B6D4"/>
  <circle cx="228" cy="182" r="10" fill="#3B82F6" fill-opacity="0.18"/>
  <circle cx="228" cy="182" r="5" fill="#3B82F6"/>
  <circle cx="414" cy="182" r="10" fill="#10B981" fill-opacity="0.18"/>
  <circle cx="414" cy="182" r="5" fill="#10B981"/>

  <!-- Brand 4-Point AI Sparks -->
  <path d="M320 18 L322.5 26.5 L331 29 L322.5 31.5 L320 40 L317.5 31.5 L309 29 L317.5 26.5 Z" fill="#7C3AED"/>
  <path d="M466 176 L468 182 L474 184 L468 186 L466 192 L464 186 L458 184 L464 182 Z" fill="#06B6D4"/>
</svg>
